<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#110c1b"/>
      <stop offset=".52" stop-color="#23102e"/>
      <stop offset="1" stop-color="#100c1a"/>
    </linearGradient>
    <radialGradient id="purple">
      <stop stop-color="#7c3aed" stop-opacity=".72"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pink">
      <stop stop-color="#db2777" stop-opacity=".5"/>
      <stop offset="1" stop-color="#db2777" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#fff" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
    <filter id="blur">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#background)"/>
  <ellipse cx="395" cy="410" rx="410" ry="260" fill="url(#purple)" filter="url(#blur)"/>
  <ellipse cx="915" cy="300" rx="360" ry="280" fill="url(#pink)" filter="url(#blur)"/>
  <rect width="1280" height="720" fill="url(#grid)"/>
</svg>
